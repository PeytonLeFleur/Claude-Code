    <!-- FAQ structured data (mirrors the on-page FAQ; all source-backed) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much do your lawn care programs cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every quote is based on your lawn's actual square footage, measured on-site, so you only pay for your property. Request a free quote and we'll get back to you, typically within 48 hours."
            }
          },
          {
            "@type": "Question",
            "name": "What's the difference between the Base and Turf Protection programs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Base Program covers seasonal fertilization, weed control, 2-step pre-emergent crabgrass control, and a late-fall winterizer. Base + Turf Protection adds preventative fungicide (2 applications), grub control, core aeration, and a 5% discount on all applications."
            }
          },
          {
            "@type": "Question",
            "name": "What areas do you serve?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Newton and 18 surrounding Central Iowa communities, including Grinnell, Pella, Baxter, Colfax, Monroe, and Prairie City. Lawn-care programs are available across the whole area; mowing, leaf, and snow coverage vary by town, so call to confirm."
            }
          },
          {
            "@type": "Question",
            "name": "How often will you mow, and how short?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Weekly or bi-weekly, with the grass cut to a healthy 3.5 inches. Trimming, edging, and clippings are managed on every visit, and scheduling is weather-based."
            }
          },
          {
            "@type": "Question",
            "name": "How does snow removal pricing work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Per-event or seasonal contract, with salt included. Pricing is tiered by accumulation (1-3, 4-7, 8-11, and 12-plus inches), and you set your own trigger depth. Current lawn-care program customers receive priority scheduling."
            }
          },
          {
            "@type": "Question",
            "name": "Why does treatment timing matter so much?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each application builds on the last. Pre-emergent has to go down before crabgrass germinates, and fungicide is preventative rather than reactive, so skipping or mistiming a single step undercuts the results of the whole program."
            }
          }
        ]
      }
